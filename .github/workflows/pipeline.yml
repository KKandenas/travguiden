name: Pipeline

# Cron körs i UTC. V85 går oftast på lördagar med första start 15:00–16:20 (svensk tid), men ibland även
# andra dagar på kvällen. Varje körning gör det som är aktuellt (python -m pipeline auto), så en extra
# eller försenad körning är ofarlig. Vinnaroddsen sparas först när vinnarpoolen har pengar, alltså på
# tävlingsdagen – därför flera körningar på lördagen fram till spelstopp.
on:
  schedule:
    - cron: "0 6 * * *"      # varje dag 08:00 / 07:00 – ny omgång, resultat från igår
    - cron: "30 16 * * *"    # varje dag 18:30 / 17:30 – uppdaterade streck, kvällsomgångar
    - cron: "30 20 * * *"    # varje dag 22:30 / 21:30 – resultat och utdelning
    - cron: "0 9 * * 6"      # lör 11:00 / 10:00
    - cron: "0 11 * * 6"     # lör 13:00 / 12:00
    - cron: "15 12 * * 6"    # lör 14:15 / 13:15 – vinnarpoolen har pengar
    - cron: "40 12 * * 6"    # lör 14:40 / 13:40 – sista före spelstopp sommartid
    - cron: "40 13 * * 6"    # lör 15:40 / 14:40 – sista före spelstopp vintertid
  workflow_dispatch:
    inputs:
      kommando:
        description: "Vad ska köras?"
        type: choice
        default: auto
        options: [auto, atg, resultat, statistik, backfill]
      fran:
        description: "backfill: första datum (YYYY-MM-DD)"
        required: false
      till:
        description: "backfill: sista datum (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  kor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kör pipelinen
        id: pipeline
        continue-on-error: true
        env:
          KOMMANDO: ${{ inputs.kommando || 'auto' }}
          FRAN: ${{ inputs.fran }}
          TILL: ${{ inputs.till }}
        run: |
          if [ "$KOMMANDO" = "backfill" ]; then
            python -m pipeline backfill "$FRAN" "$TILL"
          else
            python -m pipeline "$KOMMANDO"
          fi

      # Committa även om ett steg misslyckades: det som sparats är validerat.
      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/*.json
          if git diff --cached --quiet; then
            echo "Ingen ny data."
          else
            git commit -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC (${{ inputs.kommando || 'schema' }})"
            git pull --rebase
            git push
          fi

      - name: Markera körningen som misslyckad
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Minst ett kritiskt steg misslyckades – se loggen för 'Kör pipelinen'."
          exit 1

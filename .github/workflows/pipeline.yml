name: Pipeline

# GitHubs schemalagda körningar kan bli flera timmar sena eller utebli. Därför startas pipelinen
# varje timme (och var 20:e minut på lördagar) med kommandot `planerad`. Den gör en riktig uppdatering
# bara när en tid i pipeline/schema.py (svensk tid, tävlingsdagen räknad från spelstopp) har passerats och inte körts än – annars avslutas den
# direkt utan att anropa några API:er eller ändra någon data. Udda minuter, eftersom GitHub är mest
# belastat på hela timmar. Samma upplägg som i Stryktipsguiden.
#
# GitHub hoppar ändå över många schemalagda starter (i oktober 2026 kom ibland ingen på flera timmar). Därför
# startas pipelinen också var 15:e minut utifrån, av cron-job.org via GitHubs API (workflow_dispatch utan
# parametrar = `planerad`). Se README, "Extern start".
on:
  schedule:
    - cron: "23 * * * *"          # varje timme
    - cron: "3,43 8-15 * * 6"     # lördagar 10–17 / 09–16 svensk tid: tätare inför spelstopp
  workflow_dispatch:
    inputs:
      kommando:
        description: "Vad ska köras?"
        type: choice
        default: planerad       # externa starter utan parametrar får aldrig bli en full körning
        options: [planerad, auto, atg, experter, kommentarer, hastkoll, hastinfo, resultat, statistik, backfill]
      omgang:
        description: "hastkoll: omgång att bedöma om (t.ex. V85_2026-10-24_7_5)"
        required: false
      fran:
        description: "backfill: första datum (YYYY-MM-DD)"
        required: false
      till:
        description: "backfill: sista datum (YYYY-MM-DD)"
        required: false

permissions:
  contents: write
  issues: write       # driftvakten öppnar och stänger ärenden med etiketten driftlarm

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  kor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Databasen ligger på grenen `databas`, som bara har den senaste versionen (skrivs över vid varje körning).
      # I main skulle varje version ligga kvar i historiken (ungefär 1 MB per körning, över 1 GB per år).
      # Går den inte att hämta avbryts körningen – pipelinen får aldrig börja om med en tom databas.
      - name: Hämta databasen
        run: |
          git fetch --depth=1 origin databas
          mkdir -p data
          git show FETCH_HEAD:trav.db > data/trav.db
          test -s data/trav.db
          git rev-parse FETCH_HEAD:trav.db > "$RUNNER_TEMP/databas-fore"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kör pipelinen
        id: pipeline
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELL: ${{ vars.GEMINI_MODELL }}
          GEMINI_RESERVMODELLER: ${{ vars.GEMINI_RESERVMODELLER }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
          KOMMANDO: ${{ inputs.kommando || 'planerad' }}
          FRAN: ${{ inputs.fran }}
          TILL: ${{ inputs.till }}
          OMGANG: ${{ inputs.omgang }}
        run: |
          if [ "$KOMMANDO" = "backfill" ]; then
            python -m pipeline backfill "$FRAN" "$TILL"
          elif [ "$KOMMANDO" = "hastkoll" ] && [ -n "$OMGANG" ]; then
            python -m pipeline hastkoll --omgang "$OMGANG"
          else
            python -m pipeline "$KOMMANDO"
          fi

      # Spara även om ett steg misslyckades: det som sparats är validerat. Körningarna går en i taget
      # (concurrency), så grenen kan skrivas över utan att något går förlorat.
      - name: Spara databasen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w data/trav.db)
          if [ "$blob" = "$(cat "$RUNNER_TEMP/databas-fore")" ]; then
            echo "Databasen oförändrad."
          else
            tree=$(printf '100644 blob %s\ttrav.db\n' "$blob" | git mktree)
            commit=$(git commit-tree "$tree" -m "Databas: $(date -u +'%Y-%m-%d %H:%M') UTC")
            git push --force origin "$commit:refs/heads/databas"
          fi

      # En kopia per vecka som release-fil (komprimerad, cirka 10 MB); de 8 senaste behålls.
      - name: Säkerhetskopia av databasen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          namn="trav-$(date -u +%G-v%V).db.gz"
          gh release view databas-kopior >/dev/null 2>&1 || \
            gh release create databas-kopior --title "Databaskopior" --notes "Veckovisa kopior av data/trav.db (pipelinen)." --latest=false
          if ! gh release view databas-kopior --json assets -q '.assets[].name' | grep -qx "$namn"; then
            gzip -c data/trav.db > "$RUNNER_TEMP/$namn"
            gh release upload databas-kopior "$RUNNER_TEMP/$namn"
            gh release view databas-kopior --json assets -q '.assets[].name' | grep '^trav-' | sort | head -n -8 | \
              while read -r gammal; do gh release delete-asset databas-kopior "$gammal" -y; done
          fi

      # JSON-filerna byggs helt ur databasen, så den nya exporten läggs ovanpå senaste main i stället för att slås
      # ihop. En körning som väntat i kön har checkat ut main som den var när den startades, och git pull --rebase
      # gav då konflikter i JSON-filerna (1 november 2026).
      - name: Committa ny data
        run: |
          filer="omgang.json senaste.json historik.json"
          for f in $filer; do cp "docs/$f" "$RUNNER_TEMP/"; done
          for forsok in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $filer; do cp "$RUNNER_TEMP/$f" docs/; done
            git add docs/*.json
            if git diff --cached --quiet; then
              echo "Ingen ny data."
              exit 0
            fi
            git commit -q -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC (${{ inputs.kommando || 'schema' }})"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Fel i körningen mejlar GitHub redan om. Vakten larmar när körningarna inte startas som planerat: cron-job.org
      # har inte startat pipelinen på en timme, en planerad tid kördes mer än 45 minuter sent, eller resultat saknas.
      # Ett ärende (mejl till ägaren) öppnas en gång och stängs av sig själv när allt går som det ska igen.
      - name: Driftvakt
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          larm=$(python -m pipeline vakt)
          senast=$(gh run list -w pipeline.yml -e workflow_dispatch -L 1 --json createdAt -q '.[0].createdAt')
          if [ -n "$senast" ] && [ $(( $(date -u +%s) - $(date -u -d "$senast" +%s) )) -gt 3600 ]; then
            larm="$larm"$'\n'"cron-job.org har inte startat pipelinen sedan $senast (UTC) – bara GitHubs opålitliga schema startar den nu. Kontrollera att jobbet är aktivt och att nyckeln inte har gått ut (README, \"Extern start\")."
          fi
          larm=$(printf '%s\n' "$larm" | sed '/^$/d')
          oppet=$(gh issue list --label driftlarm --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$larm" ]; then
            echo "::warning::$larm"
            if [ -z "$oppet" ]; then
              gh label create driftlarm --color B60205 --description "Automatiskt larm från pipelinen" --force
              printf '%s\n\n%s\n' "$larm" "Ärendet stängs av sig själv när körningarna går som planerat igen." | \
                gh issue create --title "Driftlarm: körningarna går inte som planerat" --label driftlarm --body-file -
            fi
          elif [ -n "$oppet" ]; then
            gh issue close "$oppet" --comment "Körningarna går som planerat igen."
          fi

      - name: Markera körningen som misslyckad
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Minst ett kritiskt steg misslyckades – se loggen för 'Kör pipelinen'."
          exit 1
